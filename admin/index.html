<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#215b49"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; connect-src 'self' https://api.github.com; object-src 'none'; base-uri 'self'; form-action 'self'"><title>إدارة الدروس · CTRL Study</title><link rel="icon" href="../assets/icons/icon.svg"><link rel="stylesheet" href="../assets/css/style.css"><link rel="stylesheet" href="admin.css?v=2"><script type="module" src="admin.js?v=2"></script></head>
<body><main class="admin-wrap"><header class="admin-header"><a class="brand" href="../"><span class="brand-mark">⌘</span><span dir="ltr">CTRL <b>Study</b></span></a><a class="secondary" href="../">العودة للدروس</a></header><h1>إدارة الدروس</h1><p class="muted">أضف الرابط، وسيتم تجهيز الدروس ونشرها تلقائيًا.</p>
<section class="admin-panel"><div class="section-heading"><h2>الدخول للإدارة</h2><span id="login-state" class="chip">غير متصل</span></div><form id="login-form" class="admin-form"><label class="wide">رمز دخول الإدارة<input id="publish-token" type="password" required autocomplete="off" spellcheck="false" placeholder="أدخل رمز الإدارة مرة واحدة"></label><label class="wide remember"><input id="remember-token" type="checkbox" checked>حفظ الدخول على هذا الجهاز</label><p class="wide muted">عند الحفظ، يبقى رمز الإدارة في هذا المتصفح حتى تضغط تسجيل خروج. استخدم جهازك الشخصي.</p><div class="wide admin-actions"><button id="save-login" class="primary" type="submit">حفظ الدخول</button><button id="logout" class="secondary" type="button" hidden>تسجيل خروج ومسح الرمز</button></div></form><p id="login-message" role="status"></p></section>
<section class="admin-panel"><h2>إضافة قناة جديدة</h2><form id="publish-form" class="admin-form"><label class="wide">رابط قناة يوتيوب<input id="publish-url" required dir="ltr" placeholder="https://www.youtube.com/@Teacher"></label><label>المادة<select id="publish-subject" required></select></label><label>اسم المدرس (اختياري)<input id="publish-teacher" maxlength="120"></label><label class="wide">الصف (اختياري)<input id="publish-grade" maxlength="80"></label><button id="publish-channel" class="primary wide" type="submit" disabled>إضافة القناة ونشر الدروس</button></form><div id="publish-status" class="publish-result" role="status" aria-live="polite" hidden><span id="publish-spinner" class="spinner" hidden aria-hidden="true"></span><div><strong id="publish-status-title"></strong><p id="publish-status-copy"></p><a id="view-channel" class="secondary" hidden>فتح دروس القناة</a></div></div></section>
<section class="admin-panel"><h2>القنوات المنشورة</h2><div id="channel-list"></div></section><section class="admin-panel"><div class="section-heading"><h2>آخر مزامنة</h2><button id="refresh-status" class="secondary" type="button">تحديث الحالة</button></div><div id="sync-status" class="admin-status">جاري تحميل الحالة…</div></section></main></body></html>
