name: Deploy CTRL Study
on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_run:
    workflows: ['Sync YouTube channels', 'Add approved channel']
    types: [completed]
permissions:
  contents: read
concurrency:
  group: ctrl-study-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - name: Stage public files only
        run: |
          mkdir -p _site
          cp index.html manifest.json service-worker.js _site/
          cp -R assets data admin _site/
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
